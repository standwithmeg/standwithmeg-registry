name: Regenerate State PDFs
run-name: Regenerate state=${{ inputs.state || 'all-30plus' }} force=${{ inputs.force || 'false' }}

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      state:
        description: "Optional single state code or country name. Leave blank for every location with 30+ families."
        required: false
        default: ""
      force:
        description: "Bypass the activity gate and PDF cache."
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: regenerate-state-pdfs
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Check activity
        id: activity_gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          REGENERATION_SCOPE: pdf
        run: bash scripts/ci/should-run-regeneration.sh

      - name: Set up Python
        if: steps.activity_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pdf/requirements.txt

      - name: Install Python dependencies
        if: steps.activity_gate.outputs.should_run == 'true'
        run: pip install -r scripts/pdf/requirements.txt

      - name: Install Chromium for Playwright
        if: steps.activity_gate.outputs.should_run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Regenerate PDFs
        if: steps.activity_gate.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATE_INPUT: ${{ github.event.inputs.state || '' }}
          FORCE_INPUT: ${{ github.event.inputs.force || 'false' }}
        run: |
          rm -rf scripts/pdf/outputs/state_packets_pdf
          mkdir -p scripts/pdf/outputs/state_packets_pdf
          force_args=()
          if [ "$FORCE_INPUT" = "true" ]; then
            force_args+=(--force)
          fi
          cd scripts/pdf
          if [ -n "$STATE_INPUT" ]; then
            echo "Regenerating single location: $STATE_INPUT"
            python generate_state_pdf.py --source=supabase "${force_args[@]}" "$STATE_INPUT"
          else
            echo "Regenerating every location with 30+ families"
            python generate_state_pdf.py --source=supabase --all-30plus "${force_args[@]}"
          fi

      - name: Copy generated PDFs into the public release
        if: steps.activity_gate.outputs.should_run == 'true'
        run: |
          mkdir -p public/state-reports
          shopt -s nullglob
          pdfs=(scripts/pdf/outputs/state_packets_pdf/*.pdf)
          if [ ${#pdfs[@]} -gt 0 ]; then
            cp -v "${pdfs[@]}" public/state-reports/
          else
            echo "No PDFs produced."
          fi

      - name: Sync public PDF index and prune under-threshold reports
        if: steps.activity_gate.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATE_INPUT: ${{ github.event.inputs.state || '' }}
        run: |
          if [ -n "$STATE_INPUT" ]; then
            python scripts/pdf/sync_public_state_reports.py --prune
          else
            python scripts/pdf/sync_public_state_reports.py --prune --require-all
          fi

      - name: Refresh public report financials snapshot
        if: steps.activity_gate.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/pdf/sync_state_financials.py

      - name: Gate the PDF release
        if: steps.activity_gate.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STATE_INPUT: ${{ github.event.inputs.state || '' }}
        run: |
          python -m unittest scripts/pdf/test_state_pdf_release.py
          python scripts/pdf/check_actor_card_overflow.py
          verify_args=()
          if [ -n "$STATE_INPUT" ]; then
            verify_args+=(--state "$STATE_INPUT")
          fi
          python scripts/pdf/verify_state_pdf_release.py "${verify_args[@]}"

      - name: Preserve rejected PDFs for diagnosis
        if: failure() && steps.activity_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-state-pdfs-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/state-reports
          if-no-files-found: error
          retention-days: 3

      - name: Commit and publish PDFs immediately
        if: steps.activity_gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          git config user.name "Meghann Miller"
          git config user.email "founder@standwithmeg.com"
          git add public/state-reports
          if git diff --staged --quiet; then
            echo "No PDF/index/financial changes — nothing to commit."
            exit 0
          fi
          changed=$(git diff --staged --name-only | wc -l | tr -d ' ')
          git commit -m "chore: auto-regenerate ${changed} state report file(s) from live Supabase data"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push succeeded on attempt ${attempt}."
              pushed_sha="$(git rev-parse HEAD)"
              VERCEL_AUTOMATION_BYPASS_SECRET="${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" bash scripts/ci/wait-for-vercel-deploy.sh "$pushed_sha" "https://standwithmeg-registry-clean.vercel.app"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing on origin/main."
            git fetch origin main
            if ! git rebase origin/main; then
              conflicts=$(git diff --name-only --diff-filter=U)
              unexpected=$(printf '%s\n' "$conflicts" | grep -vE '^public/state-reports/' || true)
              if [ -n "$unexpected" ]; then
                echo "Unexpected conflicts: $unexpected"
                git rebase --abort
                exit 1
              fi
              while IFS= read -r file; do
                if [ -n "$file" ]; then
                  git checkout --theirs -- "$file"
                fi
              done <<< "$conflicts"
              git add $conflicts
              GIT_EDITOR=true git rebase --continue
            fi
            sleep $((attempt * 3))
          done
          echo "Push still failing after 5 attempts."
          exit 1
