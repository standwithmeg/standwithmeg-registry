name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on PRs AND on back-to-back main pushes (the regen bot
# pushes generated assets to main frequently; only the newest push needs CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-contract:
    name: PDF Release Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/pdf/requirements.txt

      - name: Install PDF dependencies
        run: pip install -r scripts/pdf/requirements.txt

      - name: Compile PDF release tooling
        run: |
          python -m py_compile scripts/pdf/generate_state_pdf.py scripts/pdf/lib_supabase_rows.py scripts/pdf/check_actor_card_overflow.py scripts/pdf/verify_state_pdf_release.py
          bash -n scripts/ci/should-run-regeneration.sh

      - name: Run PDF pagination and threshold regressions
        run: python -m unittest scripts/ci/test_should_run_regeneration.py scripts/pdf/test_state_pdf_release.py

  build:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
