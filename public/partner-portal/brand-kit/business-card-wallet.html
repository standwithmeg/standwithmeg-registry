<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  /* Wallet business card — 3.5 x 2 in @ 300dpi = 1050 x 600 px. Official palette. */
  :root { --navy:#0b1a2d; --navy-deep:#050a14; --gold:#c9a227; --gold2:#e3c25b; --cream:#f2ead6; --white:#f5f5f5; --crimson:#b91c1c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1050px; height:600px; overflow:hidden; }
  .card { position:relative; width:1050px; height:600px; overflow:hidden; font-family:"Oswald",sans-serif; color:var(--cream);
    background: radial-gradient(120% 140% at 8% 0%, #112842 0%, var(--navy) 44%, var(--navy-deep) 100%); }
  .grain { position:absolute; inset:0; opacity:.07; mix-blend-mode:overlay; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  .edge { position:absolute; left:0; top:0; width:14px; height:100%; background:linear-gradient(180deg,var(--gold2),var(--gold) 50%,#9c7d1d); }
  .photo { position:absolute; right:0; top:0; width:470px; height:100%; background:url("meg-portrait.png") 28% center/cover; }
  .photo::before { content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,var(--navy) 0%,rgba(11,26,45,.85) 22%,rgba(11,26,45,.12) 56%,transparent 80%),linear-gradient(180deg,rgba(5,10,20,.4),transparent 30%,rgba(5,10,20,.5)); }
  .content { position:absolute; left:60px; top:0; height:100%; width:600px; display:flex; flex-direction:column; justify-content:center; z-index:3; }
  .eyebrow { font-family:"Space Mono",monospace; font-weight:700; letter-spacing:.3em; font-size:20px; color:var(--gold); text-transform:uppercase; margin-bottom:14px; }
  .name { font-family:"Anton",sans-serif; font-size:82px; line-height:.88; color:var(--white); text-transform:uppercase; letter-spacing:.5px; text-shadow:0 2px 18px rgba(0,0,0,.45); }
  .role { font-family:"Space Mono",monospace; font-weight:700; font-size:21px; color:var(--gold2); text-transform:uppercase; letter-spacing:.18em; margin-top:12px; }
  .rule { width:84px; height:3px; background:var(--crimson); margin:20px 0; }
  .contact { display:flex; flex-direction:column; gap:10px; }
  .contact div { display:flex; align-items:center; gap:13px; font-weight:500; font-size:24px; color:var(--cream); }
  .contact svg { width:23px; height:23px; fill:var(--gold); flex:0 0 auto; }
  .tagline { position:absolute; left:60px; bottom:28px; font-family:"Space Mono",monospace; font-size:15px; letter-spacing:.12em; color:rgba(201,162,39,.85); z-index:3; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="edge"></div>
    <div class="photo"></div>
    <div class="grain"></div>
    <div class="content">
      <div class="eyebrow">Stand With Meg</div>
      <div class="name">Meg<br/>Miller</div>
      <div class="role">Founder &amp; Operating Partner</div>
      <div class="rule"></div>
      <div class="contact">
        <div><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg> 913-715-5370</div>
        <div><svg viewBox="0 0 24 24"><path d="M3 5h18c.6 0 1 .4 1 1v12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1V6c0-.6.4-1 1-1zm9 7L4.5 7h15L12 12zm0 2.3L4 8.8V17h16V8.8l-8 5.5z"/></svg> meg@standwithmeg.com</div>
        <div><svg viewBox="0 0 24 24"><path d="M3.9 12a3.1 3.1 0 013.1-3.1h4V7h-4a5 5 0 100 10h4v-1.9h-4A3.1 3.1 0 013.9 12zm5.1 1h6v-2H9v2zm8-6h-4v1.9h4a3.1 3.1 0 010 6.2h-4V17h4a5 5 0 000-10z"/></svg> my.standwithmeg.com/sponsor</div>
      </div>
    </div>
    <div class="tagline">Standing with families.</div>
  </div>
</body>
</html>
