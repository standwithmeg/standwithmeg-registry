<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@1,600;1,700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  /* Stand With Meg — vertical card / mini-poster, 2:3 = 1080 x 1620 px.
     Official palette. Edit the 5 spots marked EDIT below. */
  :root {
    --navy:#0b1a2d; --navy-deep:#050a14;
    --gold:#c9a227; --gold2:#e3c25b;
    --cream:#f2ead6; --white:#f5f5f5; --crimson:#b91c1c;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1620px; overflow:hidden; }
  .card { position:relative; width:1080px; height:1620px; background:var(--navy-deep);
    font-family:"Oswald",sans-serif; color:var(--cream); overflow:hidden; }
  .frame { position:absolute; inset:20px; border:1.5px solid rgba(201,162,39,.55); z-index:6; pointer-events:none; }
  .grain { position:absolute; inset:0; opacity:.08; mix-blend-mode:overlay; pointer-events:none; z-index:5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

  .photo { position:absolute; top:20px; left:20px; right:20px; height:720px;
    background:url("meg-portrait.png") center 20%/cover; }
  .photo::after { content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(5,10,20,.12) 0%, transparent 28%, rgba(5,10,20,.55) 76%, var(--navy-deep) 100%); }

  .body { position:absolute; left:20px; right:20px; top:700px; bottom:20px; z-index:4;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center; padding:26px 64px 34px; }

  .eyebrow { font-family:"Space Mono",monospace; font-weight:700; letter-spacing:.34em;
    font-size:40px; color:var(--gold); text-transform:uppercase; }
  .div { display:flex; align-items:center; justify-content:center; gap:20px; color:var(--gold); font-size:24px; }
  .div::before, .div::after { content:""; width:140px; height:2px; background:var(--crimson); }
  .top .div { margin:16px 0 4px; }

  .name { font-family:"Anton",sans-serif; text-transform:uppercase; color:var(--white);
    font-size:126px; line-height:1.04; letter-spacing:4px; text-shadow:0 3px 22px rgba(0,0,0,.5); }
  .name span { display:block; }

  .role { display:flex; align-items:center; justify-content:center; gap:24px; margin-top:16px;
    font-family:"Space Mono",monospace; font-weight:700; letter-spacing:.36em; font-size:34px; color:var(--gold); text-transform:uppercase; }
  .role::before, .role::after { content:""; width:64px; height:2px; background:var(--crimson); }

  .contact { display:inline-flex; flex-direction:column; gap:18px; text-align:left; }
  .row { display:flex; align-items:center; gap:22px; }
  .ic { width:54px; height:54px; border-radius:50%; border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ic svg { width:26px; height:26px; fill:var(--gold); }
  .bar { width:2px; height:42px; background:var(--crimson); flex:0 0 auto; }
  .row span.t { font-family:"Oswald"; font-weight:500; font-size:40px; color:var(--cream); }

  .foot-in { width:100%; }
  .foot-in .div { margin-bottom:16px; }
  .foot-in .div::before, .foot-in .div::after { width:110px; }
  .tag { font-family:"Playfair Display", Georgia, serif; font-style:italic; font-weight:600;
    font-size:36px; line-height:1.25; color:var(--gold2); max-width:880px; margin:0 auto; }
</style>
</head>
<body>
  <div class="card">
    <div class="photo"></div>
    <div class="grain"></div>
    <div class="frame"></div>

    <div class="body">
      <div class="top">
        <div class="eyebrow">Stand With Meg</div>
        <div class="div">★</div>
        <!-- EDIT 1: your name (two lines) -->
        <div class="name">Meg<br/>Miller</div>
        <!-- EDIT 2: your title -->
        <div class="role">Founder</div>
      </div>

      <div class="contact">
        <!-- EDIT 3: phone -->
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg></span><span class="bar"></span><span class="t">913-715-5370</span></div>
        <!-- EDIT 4: email -->
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 5h18c.6 0 1 .4 1 1v12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1V6c0-.6.4-1 1-1zm9 7L4.5 7h15L12 12zm0 2.3L4 8.8V17h16V8.8l-8 5.5z"/></svg></span><span class="bar"></span><span class="t">meg@standwithmeg.com</span></div>
        <!-- EDIT 5: link -->
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3.9 12a3.1 3.1 0 013.1-3.1h4V7h-4a5 5 0 100 10h4v-1.9h-4A3.1 3.1 0 013.9 12zm5.1 1h6v-2H9v2zm8-6h-4v1.9h4a3.1 3.1 0 010 6.2h-4V17h4a5 5 0 000-10z"/></svg></span><span class="bar"></span><span class="t">my.standwithmeg.com/sponsor</span></div>
      </div>

      <div class="foot-in">
        <div class="div">★</div>
        <div class="tag">The public record for families fighting government separation.</div>
      </div>
    </div>
  </div>
</body>
</html>
