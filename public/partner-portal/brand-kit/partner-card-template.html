<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@1,600&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  /* Stand With Meg — PARTNER card template (no photo). 2:3 = 1080 x 1620 px.
     Tokens {{FIRST}} {{LAST}} {{STATE}} {{PHONE}} {{EMAIL}} are filled by make-partner-card.sh. */
  :root { --navy:#0b1a2d; --navy-deep:#050a14; --gold:#c9a227; --gold2:#e3c25b; --cream:#f2ead6; --white:#f5f5f5; --crimson:#b91c1c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1620px; overflow:hidden; }
  .card { position:relative; width:1080px; height:1620px; overflow:hidden; font-family:"Oswald",sans-serif; color:var(--cream);
    background: radial-gradient(130% 80% at 50% 0%, #112842 0%, var(--navy) 46%, var(--navy-deep) 100%); }
  .stripes { position:absolute; top:0; left:0; right:0; height:520px; opacity:.10; pointer-events:none;
    background:repeating-linear-gradient(180deg, var(--crimson) 0 26px, transparent 26px 52px); -webkit-mask-image:linear-gradient(180deg,#000,transparent); }
  .grain { position:absolute; inset:0; opacity:.08; mix-blend-mode:overlay; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  .frame { position:absolute; inset:20px; border:1.5px solid rgba(201,162,39,.55); pointer-events:none; }

  .body { position:absolute; inset:20px; display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    text-align:center; padding:74px 70px 70px; z-index:3; }

  .stars { color:var(--gold); font-size:34px; letter-spacing:18px; }
  .brand { font-family:"Anton",sans-serif; text-transform:uppercase; color:var(--cream); font-size:88px; line-height:.9; margin-top:26px; letter-spacing:1px; }
  .brand .g { color:var(--gold); }

  .div { display:flex; align-items:center; justify-content:center; gap:20px; color:var(--gold); font-size:24px; margin:30px 0 8px; }
  .div::before, .div::after { content:""; width:150px; height:2px; background:var(--crimson); }

  .name { font-family:"Anton",sans-serif; text-transform:uppercase; color:var(--white);
    font-size:128px; line-height:.86; letter-spacing:1px; text-shadow:0 3px 22px rgba(0,0,0,.5); }
  .role { display:flex; align-items:center; justify-content:center; gap:22px; margin-top:18px;
    font-family:"Space Mono",monospace; font-weight:700; letter-spacing:.24em; font-size:32px; color:var(--gold); text-transform:uppercase; }
  .role::before, .role::after { content:""; width:54px; height:2px; background:var(--crimson); }

  .contact { display:inline-flex; flex-direction:column; gap:18px; text-align:left; }
  .row { display:flex; align-items:center; gap:22px; }
  .ic { width:54px; height:54px; border-radius:50%; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .ic svg { width:26px; height:26px; fill:var(--gold); }
  .bar { width:2px; height:42px; background:var(--crimson); flex:0 0 auto; }
  .row span.t { font-weight:500; font-size:40px; color:var(--cream); }

  .foot { width:100%; }
  .foot .div { margin-bottom:16px; }
  .foot .div::before, .foot .div::after { width:120px; }
  .tag { font-family:"Playfair Display", Georgia, serif; font-style:italic; font-weight:600; font-size:36px; line-height:1.25; color:var(--gold2); max-width:880px; margin:0 auto; }
</style>
</head>
<body>
  <div class="card">
    <div class="stripes"></div>
    <div class="grain"></div>
    <div class="frame"></div>

    <div class="body">
      <div class="top">
        <div class="stars">★ ★ ★ ★ ★</div>
        <div class="brand">Stand <span class="g">With</span> Meg</div>
        <div class="div">★</div>
        <div class="name">{{FIRST}}<br/>{{LAST}}</div>
        <div class="role">State Partner &middot; {{STATE}}</div>
      </div>

      <div class="contact">
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg></span><span class="bar"></span><span class="t">{{PHONE}}</span></div>
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 5h18c.6 0 1 .4 1 1v12c0 .6-.4 1-1 1H3c-.6 0-1-.4-1-1V6c0-.6.4-1 1-1zm9 7L4.5 7h15L12 12zm0 2.3L4 8.8V17h16V8.8l-8 5.5z"/></svg></span><span class="bar"></span><span class="t">{{EMAIL}}</span></div>
        <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3.9 12a3.1 3.1 0 013.1-3.1h4V7h-4a5 5 0 100 10h4v-1.9h-4A3.1 3.1 0 013.9 12zm5.1 1h6v-2H9v2zm8-6h-4v1.9h4a3.1 3.1 0 010 6.2h-4V17h4a5 5 0 000-10z"/></svg></span><span class="bar"></span><span class="t">my.standwithmeg.com/sponsor</span></div>
      </div>

      <div class="foot">
        <div class="div">★</div>
        <div class="tag">Standing with families across {{STATE}}.</div>
      </div>
    </div>
  </div>
</body>
</html>
