<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  :root{ --navy:#0b1a2d; --bg:#050a14; --gold:#c9a227; --gold2:#e3c25b; --crimson:#b91c1c; --cream:#f2ead6; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1920px;overflow:hidden;}
  .c{position:relative;width:1080px;height:1920px;font-family:"Oswald",sans-serif;color:var(--cream);
    background:linear-gradient(180deg,#112842 0%,var(--navy) 42%,var(--bg) 100%);
    display:flex;flex-direction:column;align-items:center;text-align:center;padding:120px 90px;}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  .c{justify-content:center;}
  .eyebrow{font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.34em;
    font-size:30px;color:var(--gold);text-transform:uppercase;}
  .star{display:flex;align-items:center;gap:20px;margin:32px 0 80px;color:var(--gold);font-size:24px;}
  .star::before,.star::after{content:"";width:90px;height:2px;background:var(--gold);}
  h1{font-family:"Anton";text-transform:uppercase;font-size:150px;line-height:.92;letter-spacing:1px;
    color:var(--cream);text-shadow:0 3px 24px rgba(0,0,0,.5);}
  h1 .g{color:var(--gold);}
  .sub{font-weight:500;font-size:46px;color:var(--cream);margin-top:80px;line-height:1.4;max-width:840px;}
  .cta{margin-top:96px;background:var(--crimson);color:#fff;font-weight:700;font-size:48px;
    padding:34px 76px;box-shadow:0 20px 46px -16px rgba(185,28,28,.8);}
  .foot{position:absolute;bottom:120px;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.12em;
    font-size:28px;color:var(--gold2);text-transform:uppercase;}
</style></head>
<body>
  <div class="c">
    <div class="grain"></div>
    <div class="eyebrow">Stand With Meg</div>
    <div class="star">★</div>
    <h1>One business.<br/><span class="g">One state.</span></h1>
    <p class="sub">Sponsor your state's family-court report. Your logo reaches every family who reads it — and keeps it free. Once your state's taken, it's gone.</p>
    <div class="cta">Claim your state →</div>
    <div class="foot">my.standwithmeg.com/sponsor</div>
  </div>
</body></html>
